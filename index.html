<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DexQuery</title>
    <meta
      name="description"
      content="A search-first Pokemon database for finding forms by abilities, types, moves and base stats."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body data-theme="dark">
    <div class="page-shell">
      <header class="masthead">
        <div class="masthead-copy">
          <h1>PokeFilter</h1>
          <p class="masthead-text">
            Build exact Pokemon filters by ability, type, move, egg group, and
            base stats, then scan the matches in a clean results table.
          </p>
        </div>

        <button class="theme-toggle" id="theme-toggle" data-current-theme="dark" aria-label="Toggle theme">
          <svg class="theme-icon theme-sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg class="theme-icon theme-moon-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <span class="theme-toggle-text">Day mode</span>
        </button>
      </header>

      <main class="workspace-stack">
        <section class="workspace workspace-builder">
          <div class="workspace-head">
            <div>
              <span class="panel-kicker">Search controls</span>
              <h2>Pokemon Query Builder</h2>
            </div>
          </div>

          <div id="filter-panel"></div>
        </section>

        <section class="workspace workspace-overview">
          <div class="overview-grid">
            <div id="status-panel"></div>
            <section class="reference-strip">
              <span class="panel-kicker">Example query</span>
              <h3>Target search</h3>
              <p>
                <code>intimidate</code> + <code>dark</code> +
                <code>parting-shot</code> + <code>speed &gt;= 60</code>
              </p>
            </section>
          </div>
        </section>

        <section class="workspace workspace-results">
          <div class="workspace-head">
            <div>
              <span class="panel-kicker">Results view</span>
              <h2>Matching Pokemon</h2>
            </div>
          </div>

          <div id="results-panel"></div>
        </section>
      </main>
    </div>

    <noscript>
      <div class="noscript-banner">
        DexQuery needs JavaScript enabled in order to render the search UI.
      </div>
    </noscript>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
